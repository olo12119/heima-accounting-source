appId: com.heima.accounting
productName: 黑马记账
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
electronDist: node_modules/electron/dist
asarUnpack:
  - node_modules/better-sqlite3/**/*
win:
  executableName: HeimaAccounting
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: HeimaAccounting-${version}-${arch}.${ext}
nsis:
  artifactName: HeimaAccounting-Setup-${version}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 黑马记账
portable:
  artifactName: HeimaAccounting-Portable-${version}-${arch}.${ext}
mac:
  category: public.app-category.finance
  icon: build/icon.png
  target:
    - dmg
    - zip
  artifactName: HeimaAccounting-${version}-${arch}.${ext}
  hardenedRuntime: false
  gatekeeperAssess: false
